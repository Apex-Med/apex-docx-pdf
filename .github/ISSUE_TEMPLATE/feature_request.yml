name: Feature request
description: Propose a renderer, API, tooling, or documentation capability
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Describe the user need without assuming a particular implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DOCX parsing and normalization
        - Template language
        - Layout and pagination
        - PDF output
        - Browser worker and playground
        - Diagnostics and tracing
        - Documentation
        - Packaging and tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain inputs, outputs, diagnostics, and explicit limits.
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Determinism and security considerations
      description: Identify new resource inputs, hostile-input risks, limits, or runtime dependencies. The renderer cannot rely on system fonts or network access.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and why they are insufficient.
  - type: textarea
    id: evidence
    attributes:
      label: Example or compatibility evidence
      description: Link to public specifications or attach only synthetic, redistributable fixtures with no confidential data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the roadmap, support matrix, and existing issues.
          required: true
        - label: Any attached assets are redistributable and contain no confidential data.
          required: true
