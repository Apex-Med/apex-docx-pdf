name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check formatting
        run: bun run format:check
      - name: Lint with Biome
        run: bun run lint
      - name: Type-check workspaces and Convex
        run: bun run typecheck
      - name: Run unit and integration tests
        run: bun test
      - name: Run seeded property and fuzz tests
        run: bun run test:fuzz
      - name: Verify Bun and Node determinism
        run: bun run test:cross-runtime
      - name: Verify Chromium worker determinism
        run: bun run test:browser-determinism
      - name: Smoke the local-only playground and accessibility
        run: bun run test:playground-smoke
      - name: Validate Mintlify documentation
        run: bun run docs:check
      - name: Validate fixture-corpus structure
        run: bun run fixtures:check
      - name: Validate release configuration
        run: bun run release:validate
      - name: Build workspaces
        run: bun run build
      - name: Validate package artifacts and size budgets
        run: bun run packages:validate
      - name: Verify isolated packed consumers
        run: bun run packages:consumer-smoke
