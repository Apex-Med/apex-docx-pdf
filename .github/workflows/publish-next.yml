name: Publish next prerelease

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-next to confirm the approved prerelease publication
        required: true
        type: string

concurrency:
  group: npm-publish-next
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'publish-next' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run complete quality gate
        run: bun run ci
      - name: Verify Changesets prerelease configuration and lockstep versions
        run: bun run release:validate
      - name: Publish approved prerelease artifacts with provenance
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "GitHub OIDC token request URL is missing" >&2
            exit 1
          fi
          unset NODE_AUTH_TOKEN
          npm install -g npm@latest
          # setup-node and npm -g both write _authToken; OIDC needs registry only.
          printf 'registry=https://registry.npmjs.org/\n' > "${NPM_CONFIG_USERCONFIG}"
          echo "npm $(npm --version); npmrc=$(cat "${NPM_CONFIG_USERCONFIG}")"
          for package in core docx fonts images layout template pdf engine browser devtools forms apex-docx-pdf; do
            directory="packages/$package/dist"
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              npm publish "$directory" --tag next --access public --provenance
            fi
          done
        env:
          NPM_CONFIG_PROVENANCE: "true"
