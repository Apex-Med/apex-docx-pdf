name: Publish next prerelease

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-next to confirm the approved prerelease publication
        required: true
        type: string

concurrency:
  group: npm-publish-next
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'publish-next' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Verify Changesets prerelease configuration and lockstep versions
        run: bun run release:validate
      - name: Publish approved prerelease artifacts with provenance
        run: |
          for package in core docx fonts images layout template pdf engine browser devtools apex-docx-pdf; do
            directory="packages/$package/dist"
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              npm publish "$directory" --tag next --access public --provenance
            fi
          done
        env:
          NPM_CONFIG_PROVENANCE: "true"
